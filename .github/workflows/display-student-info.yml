name: Display Student Info

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  display-student-info:
    name: Display Student Info
    runs-on: ubuntu-latest

    steps:
      - name: Extract Name and Email from PR Body
        id: extract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          NAME=$(echo "$PR_BODY" | grep -oP '(?<=Student Name: ).*' | tr -d '`\r' | xargs)
          EMAIL=$(echo "$PR_BODY" | grep -oP '(?<=UMindanao Email: ).*' | tr -d '`\r' | xargs)

          echo "student_name=$NAME" >> $GITHUB_OUTPUT
          echo "student_email=$EMAIL" >> $GITHUB_OUTPUT

      - name: Display Student Info
        run: |
          echo "================================"
          echo "  Student Name  : ${{ steps.extract.outputs.student_name }}"
          echo "  UMindanao Email : ${{ steps.extract.outputs.student_email }}"
          echo "================================"
